<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChromeTools MCP</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">CT</span>
        <span class="logo-text">ChromeTools</span>
      </div>
      <div class="connection-status" id="connection-status">
        <span class="status-dot"></span>
        <span class="status-text">Disconnected</span>
      </div>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="recorder">Recorder</button>
      <button class="tab" data-tab="tabs">Tabs</button>
      <button class="tab" data-tab="passwords">Passwords</button>
    </nav>

    <!-- Recorder Tab -->
    <section class="tab-content active" id="tab-recorder">
      <!-- Recording Status -->
      <div class="recording-status" id="recording-status">
        <span class="recording-dot"></span>
        <span class="recording-text">Not recording</span>
      </div>

      <!-- Metadata Form (shown when not recording) -->
      <div class="metadata-form" id="metadata-form">
        <div class="form-group">
          <label for="scenario-name">Scenario Name *</label>
          <input type="text" id="scenario-name" placeholder="e.g., login-flow" required>
        </div>
        <div class="form-group">
          <label for="scenario-desc">Description</label>
          <input type="text" id="scenario-desc" placeholder="Optional description">
        </div>
        <div class="form-group">
          <label for="scenario-tags">Tags</label>
          <input type="text" id="scenario-tags" placeholder="auth, critical, smoke">
        </div>
      </div>

      <!-- Action Count (shown when recording) -->
      <div class="action-count-display hidden" id="action-count-display">
        <span class="count-number" id="action-count">0</span>
        <span class="count-label">actions recorded</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn btn-primary" id="btn-start">
          <span class="btn-icon">&#9679;</span> Start Recording
        </button>
        <button class="btn btn-secondary hidden" id="btn-pause">
          <span class="btn-icon">&#10074;&#10074;</span> Pause
        </button>
        <button class="btn btn-danger hidden" id="btn-stop">
          <span class="btn-icon">&#9632;</span> Stop & Save
        </button>
        <button class="btn btn-ghost hidden" id="btn-clear">
          Clear
        </button>
        <button class="btn btn-reset hidden" id="btn-reset">
          &#10006; Reset
        </button>
      </div>

      <!-- Actions Preview -->
      <div class="actions-preview hidden" id="actions-preview">
        <h4>Recent Actions</h4>
        <ul class="actions-list" id="actions-list">
          <!-- Actions will be populated here -->
        </ul>
      </div>
    </section>

    <!-- Tabs Tab -->
    <section class="tab-content" id="tab-tabs">
      <div class="tabs-list" id="tabs-list">
        <div class="tabs-loading">Loading tabs...</div>
      </div>
    </section>

    <!-- Passwords Tab -->
    <section class="tab-content" id="tab-passwords">
      <form class="vault-form" id="vault-form" autocomplete="off">
        <div class="form-group">
          <label for="vault-url">URL *</label>
          <input type="text" id="vault-url" placeholder="https://site.ru" required>
        </div>
        <div class="form-group">
          <label for="vault-username">Login</label>
          <input type="text" id="vault-username" placeholder="user@site.ru" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="vault-password">Password *</label>
          <div class="vault-password-row">
            <input type="password" id="vault-password" autocomplete="new-password">
            <button type="button" class="btn btn-ghost btn-small" id="vault-toggle-password" title="Show / hide">&#128065;</button>
          </div>
        </div>
        <div class="form-group">
          <label for="vault-name">Name</label>
          <input type="text" id="vault-name" placeholder="Default: site host">
        </div>
        <div class="vault-error hidden" id="vault-error"></div>
        <div class="controls">
          <button type="submit" class="btn btn-primary" id="vault-save">Save</button>
          <button type="button" class="btn btn-ghost hidden" id="vault-cancel">Cancel</button>
        </div>
      </form>

      <ul class="vault-list" id="vault-list"></ul>
      <p class="vault-hint">MCP can type these passwords only on the saved site. It never receives the password itself.</p>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
